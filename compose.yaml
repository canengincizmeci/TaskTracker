services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: TaskTracker.API/Dockerfile
    environment:
      ConnectionStrings__PostgreSql: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      TokenOptions__SecurityKey: ${TOKEN_SECURITY_KEY}
      PasswordRecovery__HmacSecret: ${PASSWORD_RECOVERY_HMAC_SECRET}
    depends_on:
      - db

  client:
    build:
      context: ./tasktracker-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data: