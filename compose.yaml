services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_MILTERD: "true"
    ports:
      - "127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s
    restart: unless-stopped
  
  migrate:
    build:
      context: .
      dockerfile: TaskTracker.API/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__PostgreSql: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      TokenOptions__SecurityKey: ${TOKEN_SECURITY_KEY}
      PasswordRecovery__HmacSecret: ${PASSWORD_RECOVERY_HMAC_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


  api:
    build:
      context: .
      dockerfile: TaskTracker.API/Dockerfile
    restart: unless-stopped
    volumes:
      - task_files:/app/App_Data/task-files
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      ConnectionStrings__PostgreSql: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      TokenOptions__SecurityKey: ${TOKEN_SECURITY_KEY}
      PasswordRecovery__HmacSecret: ${PASSWORD_RECOVERY_HMAC_SECRET}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Pass: ${SMTP_PASS}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      ClientApp__BaseUrl: ${CLIENT_APP_BASE_URL}
      TaskFiles__RequireCleanScan: "true"
      TaskFiles__EnableDiscussionUploads: ${TASKFILES_ENABLE_DISCUSSION_UPLOADS:-false}
      TaskFiles__EnableSubTaskSubmissionUploads: ${TASKFILES_ENABLE_SUBTASK_SUBMISSION_UPLOADS:-false}
      TaskFiles__Scanner__Enabled: ${CLAMAV_ENABLED:-false}
      TaskFiles__Scanner__Host: ${CLAMAV_HOST:-clamav}
      TaskFiles__Scanner__Port: ${CLAMAV_PORT:-3310}
      TaskFiles__Scanner__ConnectTimeoutMs: ${CLAMAV_CONNECT_TIMEOUT_MS:-3000}
      TaskFiles__Scanner__ScanTimeoutMs: ${CLAMAV_SCAN_TIMEOUT_MS:-15000}
      TaskFiles__Scanner__MaxConcurrentScans: ${CLAMAV_MAX_CONCURRENT_SCANS:-4}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  client:
    build:
      context: ./tasktracker-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${CLIENT_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/_health"]
      interval: 15s
      timeout: 5s
      retries: 4
    depends_on:
      api:
        condition: service_healthy
   

volumes:
  postgres_data:
  clamav_data:
  task_files:
