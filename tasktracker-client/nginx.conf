# Nginx error messages can include the raw request line or upstream URL.
# Keep HTTP request diagnostics in the sanitized access log.
error_log /dev/null;
log_format tasktracker_safe escape=json
    '{"method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';

map $http_upgrade $tasktracker_connection_upgrade {
    default upgrade;
    '' close;
}

map "$realip_remote_addr:$http_x_forwarded_proto" $tasktracker_forwarded_proto {
    default $scheme;
    include /etc/nginx/tasktracker-trust/*.map;
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log tasktracker_safe;
    real_ip_header X-Forwarded-For;
    include /etc/nginx/tasktracker-trust/*.conf;

    client_max_body_size 101m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    location = /_health { access_log off; return 204; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tasktracker_forwarded_proto;
    }

    location /hubs/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tasktracker_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tasktracker_forwarded_proto;
    }
}
