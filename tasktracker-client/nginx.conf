# Nginx error messages can include the raw request line or upstream URL.
# Keep HTTP request diagnostics in the sanitized access log.
error_log /dev/null;
log_format tasktracker_safe escape=json
    '{"method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log tasktracker_safe;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
